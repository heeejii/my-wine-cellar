<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>My Wine Cellar</title>
<style>
:root{--bg:#f6f0e7;--paper:#fffaf3;--ink:#241c19;--muted:#81736b;--wine:#72243d;--line:#dfd3c7;--soft:#eee4d9;--gold:#a87920}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:920px;margin:auto;padding:30px 16px 90px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--wine);font-weight:800}
h1{font:500 38px Georgia,serif;margin:5px 0}.sub,.hint{color:var(--muted);font-size:13px;line-height:1.55}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.primary,.round{border:0;background:var(--wine);color:white;font-weight:800;cursor:pointer}.primary{border-radius:999px;padding:12px 15px}.round{width:52px;height:52px;border-radius:50%;font-size:28px;position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));box-shadow:0 8px 24px #5d243855;z-index:5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0 16px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font:600 21px Georgia,serif}.stat span{font-size:11px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:white;font:inherit;margin-bottom:10px}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 16px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px}.filter.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #5b3a2b12}.photo{aspect-ratio:4/5;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.emoji{font-size:42px;opacity:.5}.body{padding:13px}.type{font-size:10px;letter-spacing:.12em;color:var(--wine);font-weight:900}.name{font:500 18px Georgia,"Apple SD Gothic Neo",serif;margin:5px 0 6px}.stars{color:var(--gold);font-size:13px}.note{color:var(--muted);font-size:12px;line-height:1.45;margin-top:7px}.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:65px 10px}
dialog{border:0;border-radius:24px;padding:0;background:var(--paper);width:min(620px,calc(100% - 20px));max-height:90vh}dialog::backdrop{background:#1f1613aa}.modal{padding:20px;overflow:auto;max-height:90vh}h2{font:500 27px Georgia,"Apple SD Gothic Neo",serif;margin:0 0 14px}
label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;color:var(--ink)}textarea{min-height:86px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview,.detailPhoto{width:100%;max-height:390px;object-fit:cover;border-radius:16px;margin-top:8px}.preview{display:none}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.secondary,.danger{border-radius:999px;padding:10px 14px;font-weight:800;background:var(--soft);color:var(--ink);border:0}.danger{color:#9a3030;background:#f3e1df}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.meta div{background:var(--soft);border-radius:12px;padding:10px;font-size:13px}.full{white-space:pre-wrap;line-height:1.65;font-size:14px}.tools{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.round{display:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="eyebrow">MY LITTLE CELLAR</div><h1>Wine Archive</h1><div class="sub">좋았던 한 병을 잊지 않도록 🍷</div></div><button class="primary" id="addTop">+ 기록</button></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>마신 와인</span></div><div class="stat"><b id="high">0</b><span>★ 4 이상</span></div><div class="stat"><b id="rebuyStat">0</b><span>또 살래</span></div></div>
<input class="search" id="search" placeholder="와인 이름이나 후기로 검색">
<div class="filters" id="filters"></div>
<main class="grid" id="grid"></main>
<div class="tools"><button class="tool" id="exportBtn">백업 내보내기</button><label class="tool" style="margin:0;font-weight:400">백업 불러오기<input id="importFile" type="file" accept=".json,application/json" hidden></label></div>
<div class="hint" style="margin-top:8px">기록은 이 브라우저에 저장됩니다. 가끔 ‘백업 내보내기’를 눌러 파일을 보관해 주세요.</div>
</div>
<button class="round" id="addFloat" aria-label="와인 추가">+</button>

<dialog id="formDlg"><form class="modal" id="form">
<h2 id="formTitle">새 와인 기록</h2><input type="hidden" id="editId">
<label>사진</label><input type="file" id="imageFile" accept="image/*"><img class="preview" id="preview">
<label>와인 이름 *</label><input id="name" required placeholder="라벨에 적힌 이름">
<div class="row"><div><label>종류</label><select id="type"><option>레드</option><option>화이트</option><option>스파클링</option><option>로제</option><option>기타</option></select></div><div><label>평점</label><select id="rating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div></div>
<div class="row"><div><label>마신 날</label><input id="date" type="date"></div><div><label>가격</label><input id="price" placeholder="29,900원"></div></div>
<div class="row"><div><label>산지 · 품종</label><input id="origin" placeholder="미국 · 피노누아"></div><div><label>재구매</label><select id="rebuy"><option value="O">또 살래 🍷</option><option value="△">고민됨</option><option value="X">안 살래</option></select></div></div>
<label>같이 먹은 것</label><input id="pairing" placeholder="치즈, 스테이크...">
<label>한줄 후기</label><textarea id="review" placeholder="예: 부드럽고 향 좋음. 이 가격이면 또 삼 ㅋㅋ"></textarea>
<div class="actions"><button type="button" class="secondary" id="cancel">취소</button><button class="primary" type="submit">저장</button></div>
</form></dialog>

<dialog id="detailDlg"><div class="modal" id="detail"></div></dialog>
<script>
const KEY='my-wine-cellar-v2', $=x=>document.getElementById(x);
let wines=[];try{wines=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let filter='전체', pendingImage='';
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const stars=n=>'★'.repeat(+n)+'☆'.repeat(5-(+n));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(wines));render()}catch(e){alert('사진 용량이 너무 커 저장하지 못했어요. 더 작은 사진으로 다시 시도해 주세요.')}}
function render(){
 $('total').textContent=wines.length;$('high').textContent=wines.filter(w=>+w.rating>=4).length;$('rebuyStat').textContent=wines.filter(w=>w.rebuy==='O').length;
 const fs=['전체','레드','화이트','스파클링','로제','재구매'];
 $('filters').innerHTML=fs.map(x=>`<button class="filter ${filter===x?'on':''}" data-f="${x}">${x}</button>`).join('');
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 let q=$('search').value.toLowerCase().trim();
 let list=wines.filter(w=>(filter==='전체'||(filter==='재구매'?w.rebuy==='O':w.type===filter))&&(!q||[w.name,w.review,w.origin,w.pairing].join(' ').toLowerCase().includes(q)));
 $('grid').innerHTML=list.length?list.map(w=>`<article class="card" data-id="${w.id}"><div class="photo">${w.image?`<img src="${w.image}" alt="">`:'<div class="emoji">🍷</div>'}</div><div class="body"><div class="type">${esc(w.type)}${w.rebuy==='O'?' · REBUY':''}</div><div class="name">${esc(w.name)}</div><div class="stars">${stars(w.rating)}</div><div class="note">${esc(w.review||'한줄평 없음')}</div></div></article>`).join(''):'<div class="empty">아직 기록이 없어요.<br>첫 와인을 남겨보세요 🍷</div>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}
function openForm(w){
 $('form').reset();$('editId').value=w?.id||'';$('formTitle').textContent=w?'와인 기록 수정':'새 와인 기록';pendingImage=w?.image||'';
 $('preview').src=pendingImage;$('preview').style.display=pendingImage?'block':'none';
 if(w){['name','type','rating','date','price','origin','rebuy','pairing','review'].forEach(k=>$(k).value=w[k]||'')}
 else{$('rating').value='4';$('rebuy').value='O';$('date').value=new Date().toISOString().slice(0,10)}
 $('formDlg').showModal();
}
$('imageFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{let max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingImage=c.toDataURL('image/jpeg',.72);$('preview').src=pendingImage;$('preview').style.display='block'};img.src=r.result};r.readAsDataURL(f)}
$('form').onsubmit=e=>{e.preventDefault();let id=$('editId').value||String(Date.now()),w={id,image:pendingImage};['name','type','rating','date','price','origin','rebuy','pairing','review'].forEach(k=>w[k]=$(k).value);let i=wines.findIndex(x=>x.id===id);if(i>=0)wines[i]=w;else wines.unshift(w);persist();$('formDlg').close()}
function showDetail(id){let w=wines.find(x=>x.id===id);if(!w)return;$('detail').innerHTML=`${w.image?`<img class="detailPhoto" src="${w.image}">`:''}<div class="type">${esc(w.type)}</div><h2>${esc(w.name)}</h2><div class="stars">${stars(w.rating)}</div><div class="meta"><div>📅 ${esc(w.date||'-')}</div><div>💰 ${esc(w.price||'-')}</div><div>🌍 ${esc(w.origin||'-')}</div><div>🍷 재구매 ${esc(w.rebuy||'-')}</div></div><label>같이 먹은 것</label><div>${esc(w.pairing||'-')}</div><label>내 후기</label><div class="full">${esc(w.review||'-')}</div><div class="actions"><button class="danger" id="del">삭제</button><div><button class="secondary" id="closeD">닫기</button> <button class="primary" id="editD">수정</button></div></div>`;$('detailDlg').showModal();$('closeD').onclick=()=>$('detailDlg').close();$('editD').onclick=()=>{$('detailDlg').close();openForm(w)};$('del').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){wines=wines.filter(x=>x.id!==id);persist();$('detailDlg').close()}}}
$('addTop').onclick=$('addFloat').onclick=()=>openForm();$('cancel').onclick=()=>$('formDlg').close();$('search').oninput=render;
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(wines,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wine-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;if(confirm('현재 기록을 백업 파일 내용으로 바꿀까요?')){wines=data;persist()}}catch(x){alert('올바른 와인 백업 파일이 아니에요.')}};r.readAsText(f)}
render();
</script>
</body></html>
